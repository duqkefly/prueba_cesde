<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesde - Cursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark" style="background-color: #e6007e;">
    <div class="container">
      <span class="navbar-brand">CESDE - Gestión de cursos</span>
    </div>
  </nav>

  <div class="container py-4">
    <!-- <button type="button" id="btnPrueba" class="btn btn-outline-secondary btn-sm mb-3">Probar conexión a la BD...</button> -->

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabCursos">Cursos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabDocentes">Docentes</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tabCursos">
        <form id="filtroCursos" class="card card-body bg-light mb-3">
          <h6>Buscar cursos</h6>
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-4">
              <label class="form-label small mb-1">Nombre</label>
              <input type="text" id="filtroCursoNombre" class="form-control" placeholder="Ej: Java">
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label small mb-1">Inicia desde</label>
              <input type="date" id="filtroDesde" class="form-control">
            </div>
            <div class="col-6 col-md-2">
              <label class="form-label small mb-1">Hasta</label>
              <input type="date" id="filtroHasta" class="form-control">
            </div>
            <div class="col-6 col-md-2">
              <button type="submit" class="btn btn-primary w-100">Buscar</button>
            </div>
            <div class="col-6 col-md-2">
              <button type="button" id="limpiarCursos" class="btn btn-secondary w-100">Limpiar</button>
            </div>
          </div>
        </form>

        <form id="formCurso" class="card card-body mb-3">
          <h5 id="tituloCurso">Nuevo curso</h5>
          <input type="hidden" id="cursoId">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <input type="text" id="cursoNombre" class="form-control" placeholder="Nombre" maxlength="100" required>
            </div>
            <div class="col-12 col-md-8">
              <input type="text" id="cursoDescripcion" class="form-control" placeholder="Descripción" maxlength="500" required>
            </div>
            <div class="col-6 col-md-2">
              <input type="number" id="cursoDuracion" class="form-control" placeholder="Semanas" min="1" step="1" required>
            </div>
            <div class="col-6 col-md-2">
              <input type="number" id="cursoPrecio" class="form-control" placeholder="Precio" min="1" step="0.01" required>
            </div>
            <div class="col-12 col-md-3">
              <input type="datetime-local" id="cursoFecha" class="form-control" required>
            </div>
            <div class="col-12 col-md-3">
              <select id="cursoDocente" class="form-select" required></select>
            </div>
            <div class="col-12 col-md-2">
              <button type="submit" class="btn btn-success w-100">Guardar</button>
            </div>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nombre</th>
                <th class="d-none d-lg-table-cell">Descripción</th>
                <th>Semanas</th>
                <th>Precio</th>
                <th>Fecha inicio</th>
                <th>Docente</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tablaCursos"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="tabDocentes">
        <form id="filtroDocentes" class="card card-body bg-light mb-3">
          <h6>Buscar docentes</h6>
          <div class="row g-2 align-items-end">
            <div class="col-12 col-md-8">
              <label class="form-label small mb-1">Nombre</label>
              <input type="text" id="filtroDocenteNombre" class="form-control" placeholder="Ej: Laura">
            </div>
            <div class="col-6 col-md-2">
              <button type="submit" class="btn btn-primary w-100">Buscar</button>
            </div>
            <div class="col-6 col-md-2">
              <button type="button" id="limpiarDocentes" class="btn btn-secondary w-100">Limpiar</button>
            </div>
          </div>
        </form>

        <form id="formDocente" class="card card-body mb-3">
          <h5 id="tituloDocente">Nuevo docente</h5>
          <input type="hidden" id="docenteId">
          <div class="row g-2">
            <div class="col-12 col-md-4">
              <input type="text" id="docenteNombre" class="form-control" placeholder="Nombre" maxlength="100"
                pattern="[A-Za-zÁÉÍÓÚáéíóúÑñ ]+" title="Solo letras" required>
            </div>
            <div class="col-12 col-md-3">
              <input type="text" id="docenteDocumento" class="form-control" placeholder="Documento" inputmode="numeric"
                pattern="[0-9]{5,15}" title="Solo números, entre 5 y 15 dígitos" required>
            </div>
            <div class="col-12 col-md-3">
              <input type="email" id="docenteCorreo" class="form-control" placeholder="Correo" maxlength="100" required>
            </div>
            <div class="col-12 col-md-2">
              <button type="submit" class="btn btn-success w-100">Guardar</button>
            </div>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nombre</th>
                <th>Documento</th>
                <th>Correo</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="tablaDocentes"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal para confirmar la eliminacion -->
  <div class="modal fade" id="modalEliminar" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Eliminar</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <p id="textoEliminar" class="mb-0"></p>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" id="btnConfirmarEliminar" class="btn btn-danger">Eliminar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
