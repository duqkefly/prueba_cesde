<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cesde - Cursos</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-dark bg-primary">
    <div class="container">
      <span class="navbar-brand">CESDE - Gestión de cursos</span>
    </div>
  </nav>

  <div class="container py-4">
    <!-- <button type="button" id="btnPrueba" class="btn btn-outline-secondary btn-sm mb-3">Probar conexión a la BD...</button> -->

    <ul class="nav nav-tabs mb-3">
      <li class="nav-item">
        <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#tabCursos">Cursos</button>
      </li>
      <li class="nav-item">
        <button class="nav-link" data-bs-toggle="tab" data-bs-target="#tabDocentes">Docentes</button>
      </li>
    </ul>

    <div class="tab-content">
      <div class="tab-pane fade show active" id="tabCursos">
        <form id="formCurso" class="card card-body mb-3">
          <h5>Nuevo curso</h5>
          <div class="row g-2">
            <div class="col-md-4">
              <input type="text" id="cursoNombre" class="form-control" placeholder="Nombre">
            </div>
            <div class="col-md-8">
              <input type="text" id="cursoDescripcion" class="form-control" placeholder="Descripción">
            </div>
            <div class="col-md-2">
              <input type="number" id="cursoDuracion" class="form-control" placeholder="Semanas">
            </div>
            <div class="col-md-2">
              <input type="number" id="cursoPrecio" class="form-control" placeholder="Precio">
            </div>
            <div class="col-md-3">
              <input type="datetime-local" id="cursoFecha" class="form-control">
            </div>
            <div class="col-md-3">
              <select id="cursoDocente" class="form-select"></select>
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-success w-100">Guardar</button>
            </div>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nombre</th>
                <th>Descripción</th>
                <th>Semanas</th>
                <th>Precio</th>
                <th>Fecha inicio</th>
                <th>Docente</th>
              </tr>
            </thead>
            <tbody id="tablaCursos"></tbody>
          </table>
        </div>
      </div>

      <div class="tab-pane fade" id="tabDocentes">
        <form id="formDocente" class="card card-body mb-3">
          <h5>Nuevo docente</h5>
          <div class="row g-2">
            <div class="col-md-4">
              <input type="text" id="docenteNombre" class="form-control" placeholder="Nombre">
            </div>
            <div class="col-md-3">
              <input type="text" id="docenteDocumento" class="form-control" placeholder="Documento">
            </div>
            <div class="col-md-3">
              <input type="email" id="docenteCorreo" class="form-control" placeholder="Correo">
            </div>
            <div class="col-md-2">
              <button type="submit" class="btn btn-success w-100">Guardar</button>
            </div>
          </div>
        </form>

        <div class="table-responsive">
          <table class="table table-striped table-hover align-middle">
            <thead class="table-dark">
              <tr>
                <th>Nombre</th>
                <th>Documento</th>
                <th>Correo</th>
              </tr>
            </thead>
            <tbody id="tablaDocentes"></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
